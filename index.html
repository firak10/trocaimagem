<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Imagem NFC</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

    <main class="w-full max-w-4xl flex flex-col items-center justify-center min-h-[90vh]">
        
        <!-- Cartão da Imagem -->
        <div id="imageCard" class="relative w-full flex items-center justify-center rounded-2xl bg-slate-800/60 border border-slate-700/50 shadow-2xl backdrop-blur-sm p-2 sm:p-4 transition-all duration-300">
            
            <!-- Skeleton Loading -->
            <div id="loadingSkeleton" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-800/90 rounded-2xl gap-3 z-10 animate-pulse">
                <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-sm font-medium text-slate-400">Carregando imagem...</p>
            </div>

            <!-- Imagem Principal -->
            <img 
                id="mainImage" 
                alt="Imagem NFC" 
                class="hidden max-h-[80vh] w-auto max-w-full object-contain rounded-xl shadow-lg transition-all duration-500 hover:scale-[1.01]"
            >

            <!-- Container de Erro -->
            <div id="errorMessage" class="hidden flex-col items-center justify-center text-center p-8 sm:p-12 my-6">
                <div class="w-16 h-16 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center mb-4 border border-red-500/20">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                </div>
                <h2 class="text-xl font-semibold text-slate-200 mb-2">Imagem não encontrada</h2>
                <p class="text-slate-400 text-sm max-w-md mb-6 leading-relaxed">
                    Não foi possível carregar o arquivo <code class="bg-slate-700/60 px-2 py-0.5 rounded text-indigo-300 font-mono text-xs">imagem.jpg</code>. Verifique se o arquivo está na mesma pasta do repositório.
                </p>
                <button 
                    onclick="window.location.reload()" 
                    class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-lg shadow-md transition-all duration-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
                >
                    Tentar Novamente
                </button>
            </div>

        </div>

    </main>

    <script>
        const img = document.getElementById('mainImage');
        const skeleton = document.getElementById('loadingSkeleton');
        const errorMsg = document.getElementById('errorMessage');

        function handleImageLoad() {
            if (skeleton) skeleton.classList.add('hidden');
            if (img) img.classList.remove('hidden');
        }

        function handleImageError() {
            if (skeleton) skeleton.classList.add('hidden');
            if (img) img.classList.add('hidden');
            if (errorMsg) {
                errorMsg.classList.remove('hidden');
                errorMsg.classList.add('flex');
            }
        }

        // Atribui os ouvintes antes de definir o src para evitar perder o evento em cache
        img.onload = handleImageLoad;
        img.onerror = handleImageError;

        // Adiciona timestamp para ignorar cache e buscar a versão mais recente do repositório
        img.src = "imagem.jpg?v=" + new Date().getTime();
    </script>
</body>
</html>
