<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Imagem NFC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 antialiased">

    <main class="w-full max-w-lg bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-md">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white mb-1">Atualizar Imagem NFC</h1>
            <p class="text-sm text-slate-400">Envie uma nova foto para substituir a atual (<code class="text-indigo-400 font-mono">imagem.jpg</code>)</p>
        </div>

        <!-- Preview da Imagem Selecionada -->
        <div class="mb-6 flex flex-col items-center">
            <div id="previewContainer" class="w-full h-56 bg-slate-900/50 rounded-xl border-2 border-dashed border-slate-700 flex items-center justify-center overflow-hidden relative">
                <img id="imagePreview" class="hidden w-full h-full object-contain" alt="Pré-visualização">
                <div id="placeholderText" class="text-center p-4">
                    <svg class="w-10 h-10 text-slate-500 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <p class="text-xs text-slate-400">Nenhuma imagem selecionada</p>
                </div>
            </div>
        </div>

        <!-- Formulário de Upload -->
        <form id="uploadForm" class="space-y-4">
            
            <!-- Selecionar Arquivo -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Selecione a nova foto</label>
                <input 
                    type="file" 
                    id="fileInput" 
                    accept="image/*" 
                    required
                    class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600/20 file:text-indigo-300 hover:file:bg-indigo-600/30 file:cursor-pointer cursor-pointer border border-slate-700 rounded-lg bg-slate-900/40 p-1"
                >
            </div>

            <!-- Parâmetros Ocultos/Carregados da URL -->
            <input type="hidden" id="repoOwner">
            <input type="hidden" id="repoName">
            <input type="hidden" id="githubToken">

            <!-- Status de Configuração das Chaves da URL -->
            <div id="configWarning" class="hidden p-3 rounded-lg text-xs font-medium text-center bg-amber-500/10 text-amber-400 border border-amber-500/20">
                Parâmetros ausentes na URL. Acesse o link completo gravado na chave.
            </div>

            <!-- Status do Envio -->
            <div id="statusMessage" class="hidden p-3 rounded-lg text-xs font-medium text-center"></div>

            <!-- Botão Enviar -->
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm rounded-lg shadow-lg transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.99]"
            >
                <span id="btnText">Enviar e Substituir Imagem</span>
                <div id="btnSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            </button>
        </form>

    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const placeholderText = document.getElementById('placeholderText');
        const uploadForm = document.getElementById('uploadForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const configWarning = document.getElementById('configWarning');

        // Extrai usuário, repositório e token da URL separada por "?"
        // Formato esperado: .../alterar2.html?usuario?repositorio?token
        function parseUrlParams() {
            const searchStr = window.location.search;
            if (!searchStr) return null;

            // Divide a busca tirando a primeira '?'
            const parts = searchStr.substring(1).split('?');
            if (parts.length >= 3) {
                return {
                    owner: parts[0],
                    repo: parts[1],
                    token: parts[2]
                };
            }
            return null;
        }

        const params = parseUrlParams();

        if (params && params.owner && params.repo && params.token) {
            document.getElementById('repoOwner').value = params.owner;
            document.getElementById('repoName').value = params.repo;
            document.getElementById('githubToken').value = params.token;
        } else {
            configWarning.classList.remove('hidden');
            submitBtn.disabled = true;
        }

        // Pré-visualização da imagem selecionada
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.src = event.target.result;
                    imagePreview.classList.remove('hidden');
                    placeholderText.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Envio para o GitHub via API
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const owner = document.getElementById('repoOwner').value.trim();
            const repo = document.getElementById('repoName').value.trim();
            const token = document.getElementById('githubToken').value.trim();
            const file = fileInput.files[0];

            if (!file || !owner || !repo || !token) return;

            setLoading(true);
            showStatus('Processando arquivo...', 'info');

            try {
                // 1. Converter imagem para Base64
                const base64Content = await fileToBase64(file);
                const filePath = 'imagem.jpg';

                // 2. Buscar o SHA da 'imagem.jpg' atual no repositório
                let sha = null;
                const getFileUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;
                
                const getResponse = await fetch(getFileUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (getResponse.ok) {
                    const fileData = await getResponse.json();
                    sha = fileData.sha;
                }

                // 3. Substituir o arquivo via API do GitHub
                const putBody = {
                    message: 'Atualizando imagem.jpg via chave NFC',
                    content: base64Content,
                    ...(sha && { sha })
                };

                const putResponse = await fetch(getFileUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(putBody)
                });

                if (putResponse.ok) {
                    showStatus('Imagem alterada com sucesso! Aguarde 1 a 2 minutos para atualizar no site principal.', 'success');
                } else {
                    const errData = await putResponse.json();
                    throw new Error(errData.message || 'Erro ao atualizar no GitHub.');
                }

            } catch (error) {
                showStatus(`Erro: ${error.message}`, 'error');
            } finally {
                setLoading(false);
            }
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = 'Enviando...';
                btnSpinner.classList.remove('hidden');
            } else {
                btnText.textContent = 'Enviar e Substituir Imagem';
                btnSpinner.classList.add('hidden');
            }
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 'bg-indigo-500/10', 'text-indigo-400', 'border-indigo-500/20');

            if (type === 'success') {
                statusMessage.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
            } else if (type === 'error') {
                statusMessage.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
            } else {
                statusMessage.classList.add('bg-indigo-500/10', 'text-indigo-400', 'border', 'border-indigo-500/20');
            }
        }
    </script>
</body>
</html>
